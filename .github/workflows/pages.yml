# Publica o app web (iFrota-web) no GitHub Pages a cada push na main que mexa
# nele. Os testes rodam antes: se falharem, nada é publicado.
# Ativação (uma vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar IF-rota

on:
  push:
    branches: [main]
    paths: ["iFrota-web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: iFrota-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Os testes só usam módulos locais — não precisam de npm install.
      - name: Testes (pathfinding + dados)
        run: npm test
      - name: Montar www/ (só os assets do app)
        run: node build-www.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iFrota-web/www
      - id: deploy
        uses: actions/deploy-pages@v4
